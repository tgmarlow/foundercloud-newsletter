subject: "Build Sheet: Steady habits, short punch lists"
preheader: "Plus: two one-page tests for a bad week and for launch day."
hook:
  - "Founders, a slipped launch usually slips on the wrong work. Say you spend three weeks polishing welcome animations while your signup emails land in spam. The product looks finished, and no trial user can log in. Or say a lost deal on Monday rewrites the roadmap by Wednesday, and a big inbound lead rewrites it again two weeks later. A month goes by and nothing ships."
  - "This week's two posts are about holding steady through both. Ballast covers the boring habits that still happen in a bad week: a thirty-minute weekly review, a monthly runway number and a one-line decision log. Its Heavy Week test asks whether all three would survive a rough week. The Punch List covers launch. Walk the product like a stranger, run the Blocks a User or Bugs Only You? test, and fix only what stops a first user."
  - "Both tests fit on one page, and the worksheets are in the posts. Pick the one that matches your week and run it before Friday. If you want a second set of eyes on your punch list, share it in the FounderCloud community."
quote:
  text: "If you are not embarrassed by the first version of your product, you've launched too late."
  attribution: "Reid Hoffman"
