name: Build Sheet

on:
  schedule:
    # Mondays 13:00 UTC, about 9:00am US Eastern.
    - cron: "0 13 * * 1"
  workflow_dispatch:
    inputs:
      date:
        description: "Issue date YYYY-MM-DD (default: today UTC)"
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      issue_date: ${{ steps.render.outputs.issue_date }}
      pages_url: ${{ steps.render.outputs.pages_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Render issue
        id: render
        env:
          ISSUE_DATE: ${{ inputs.date }}
        run: python scripts/build_issue.py --github-output "$GITHUB_OUTPUT"

      - name: Commit rendered issue and state
        run: |
          git config user.name "foundercloud-newsletter"
          git config user.email "weeklyupdate@starthawk.io"
          git add issues state
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Render Build Sheet ${{ steps.render.outputs.issue_date }}"
            branch="${GITHUB_REF_NAME}"
            issue_date="${{ steps.render.outputs.issue_date }}"
            # Checkout is the SHA from when the run was queued, so main may
            # have moved. Rebase onto the remote branch and retry the push.
            # Generated files can conflict with a newer render; rebuild those
            # on the latest commit instead of failing the run.
            for attempt in 1 2 3 4 5; do
              refspec="+refs/heads/${branch}:refs/remotes/origin/${branch}"
              if [ -f "$(git rev-parse --git-path shallow)" ]; then
                git fetch --unshallow origin "$refspec"
              else
                git fetch origin "$refspec"
              fi
              tip="$(git rev-parse "refs/remotes/origin/${branch}")"
              if git rebase "$tip"; then
                :
              else
                rebase_dir="$(git rev-parse --git-path rebase-merge)"
                apply_dir="$(git rev-parse --git-path rebase-apply)"
                if [ ! -d "$rebase_dir" ] && [ ! -d "$apply_dir" ]; then
                  echo "Rebase onto ${branch} failed."
                  exit 1
                fi
                echo "Rendered files conflicted with ${branch}; re-rendering on the latest commit."
                git rebase --abort
                git reset --hard "$tip"
                python scripts/build_issue.py --date "$issue_date"
                git add issues state
                if git diff --cached --quiet; then
                  echo "No changes to commit after re-render."
                  exit 0
                fi
                git commit -m "Render Build Sheet ${issue_date}"
              fi
              if git push origin "HEAD:${branch}"; then
                exit 0
              fi
              echo "Push rejected on attempt ${attempt}; retrying."
            done
            echo "Failed to push rendered issue to ${branch}."
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: issues

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  zoho:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Fast-forward to the rendered commit
        run: git pull --ff-only origin main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create unsent Zoho draft
        id: zoho
        env:
          ZOHO_CLIENT_ID: ${{ secrets.ZOHO_CLIENT_ID }}
          ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET }}
          ZOHO_REFRESH_TOKEN: ${{ secrets.ZOHO_REFRESH_TOKEN }}
          ZOHO_LIST_KEY: ${{ secrets.ZOHO_LIST_KEY }}
          ZOHO_FROM_EMAIL: ${{ secrets.ZOHO_FROM_EMAIL }}
          ZOHO_TOPIC_ID: ${{ secrets.ZOHO_TOPIC_ID }}
          ISSUE_DATE: ${{ needs.build.outputs.issue_date }}
          CONTENT_URL: ${{ needs.build.outputs.pages_url }}
        run: python scripts/zoho_draft.py

      - name: Record campaign key
        if: always() && (steps.zoho.outcome == 'success' || steps.zoho.outcome == 'failure')
        run: |
          git config user.name "foundercloud-newsletter"
          git config user.email "weeklyupdate@starthawk.io"
          git add state/featured.json
          if git diff --cached --quiet; then
            echo "No campaign key to record."
          else
            git commit -m "Record Zoho draft key for ${{ needs.build.outputs.issue_date }}"
            cp state/featured.json /tmp/featured-with-key.json
            branch="main"
            # Same race as the render push: main can move before this push.
            # On a conflict, replay only the new campaign_key values onto the
            # latest state file so a re-run does not create a second draft.
            pushed=0
            for attempt in 1 2 3 4 5; do
              refspec="+refs/heads/${branch}:refs/remotes/origin/${branch}"
              if [ -f "$(git rev-parse --git-path shallow)" ]; then
                git fetch --unshallow origin "$refspec"
              else
                git fetch origin "$refspec"
              fi
              tip="$(git rev-parse "refs/remotes/origin/${branch}")"
              if ! git rebase "$tip"; then
                rebase_dir="$(git rev-parse --git-path rebase-merge)"
                apply_dir="$(git rev-parse --git-path rebase-apply)"
                if [ ! -d "$rebase_dir" ] && [ ! -d "$apply_dir" ]; then
                  echo "Rebase of the campaign key commit failed."
                  exit 1
                fi
                echo "Campaign key commit conflicted; reapplying keys onto latest main."
                git rebase --abort
                git reset --hard "$tip"
                python -c 'from pathlib import Path; from newsletter.zoho import apply_saved_campaign_keys; apply_saved_campaign_keys(Path("/tmp/featured-with-key.json"), Path("state/featured.json"))'
                git add state/featured.json
                if git diff --cached --quiet; then
                  echo "Campaign key already on latest main."
                  pushed=1
                  break
                fi
                git commit -m "Record Zoho draft key for ${{ needs.build.outputs.issue_date }}"
              fi
              if git push origin "HEAD:${branch}"; then
                pushed=1
                break
              fi
              echo "Push rejected on attempt ${attempt}; retrying."
            done
            if [ "$pushed" != 1 ]; then
              echo "Failed to push the campaign key to ${branch}."
              exit 1
            fi
          fi
          if [ "${{ steps.zoho.outcome }}" != "success" ]; then
            echo "Zoho draft step failed."
            exit 1
          fi
